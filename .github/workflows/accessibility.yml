name: Accessibility NFR

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  a11y-public:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx lhci autorun --config=lighthouserc.public.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11y-report-public
          path: frontend/lhci-reports/public