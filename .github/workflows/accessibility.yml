name: Accessibility NFR

on:
  pull_request:
    branches: [dev, main]

jobs:
  verify-frontend-accessibility:
    name: Frontend Accessibility
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Start auth mock
        run: |
          node -e "require('http').createServer((req, res) => { const headers = {'Access-Control-Allow-Origin': '*', 'Access-Control-Allow-Methods': 'GET, POST, OPTIONS', 'Access-Control-Allow-Headers': 'Content-Type, Authorization'}; if (req.method === 'OPTIONS') { res.writeHead(204, headers); res.end(); return; } if (req.url === '/auth/me') { res.writeHead(401, {...headers, 'Content-Type': 'application/json'}); res.end(JSON.stringify({message: 'Unauthorized'})); return; } res.writeHead(404, headers); res.end(); }).listen(3000)" &

      - name: Run accessibility audit 
        working-directory: frontend
        run: npx --no-install lhci autorun --config=lighthouserc.public.cjs

      - name: Upload accessibility report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11y-report-public
          path: frontend/lhci-reports/public

      # Debug Section
      - name: Install puppeteer for debug capture
        if: failure()
        working-directory: frontend
        run: npm install --no-save --ignore-scripts puppeteer@24.15.0

      - name: Install Chrome for puppeteer
        if: failure()
        working-directory: frontend
        run: npx --yes puppeteer@24.15.0 browsers install chrome

      - name: Capture debug screenshot + console output
        if: failure()
        working-directory: frontend
        timeout-minutes: 2
        run: |
          node - <<'EOF'
          const puppeteer = require('puppeteer');
          const { spawn } = require('child_process');
          (async () => {
            const server = spawn('npm', ['run', 'preview', '--', '--port', '4173']);
            await new Promise(r => setTimeout(r, 3000));
            const browser = await puppeteer.launch({ headless: 'new', args: ['--no-sandbox'] });
            const page = await browser.newPage();
            const logs = [];
            page.on('console', msg => logs.push(`PAGE LOG: ${msg.text()}`));
            page.on('pageerror', err => logs.push(`PAGE ERROR: ${err.message}`));
            page.on('requestfailed', req => logs.push(`REQUEST FAILED: ${req.url()} ${req.failure()?.errorText}`));
            page.on('request', req => logs.push(`REQUEST: ${req.method()} ${req.url()}`));
            await page.goto('http://localhost:4173/', { waitUntil: 'domcontentloaded', timeout: 15000 }).catch(e => logs.push(`GOTO ERROR: ${e.message}`));
            await new Promise(r => setTimeout(r, 5000)); // let it try to render/settle
            await page.screenshot({ path: 'debug-screenshot.png', fullPage: true });
            require('fs').writeFileSync('debug-dom.html', await page.content());
            require('fs').writeFileSync('debug-console.log', logs.join('\n'));
            await browser.close();
            server.kill();
            process.exit(0);
          })();
          EOF

      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-debug-capture
          path: |
            frontend/debug-screenshot.png
            frontend/debug-dom.html
            frontend/debug-console.log