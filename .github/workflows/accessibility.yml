name: Accessibility NFR

on:
  pull_request:
    branches: [dev, main]

jobs:
  verify-frontend-accessibility:
    name: Frontend Accessibility
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: npx --no-install playwright install --with-deps chromium

      - name: Start auth mock
        run: |
          node -e "require('http').createServer((req, res) => { const headers = {'Access-Control-Allow-Origin': 'http://localhost:5173', 'Access-Control-Allow-Credentials': 'true', 'Access-Control-Allow-Methods': 'GET, POST, OPTIONS', 'Access-Control-Allow-Headers': 'Content-Type, Authorization'}; if (req.method === 'OPTIONS') { res.writeHead(204, headers); res.end(); return; } if (req.url === '/auth/me') { res.writeHead(401, {...headers, 'Content-Type': 'application/json'}); res.end(JSON.stringify({message: 'Unauthorized'})); return; } res.writeHead(404, headers); res.end(); }).listen(3000)" &

      - name: Run accessibility audit (axe-core)
        run: npm run a11y:public

      - name: Upload accessibility report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11y-report-public
          path: a11y-report