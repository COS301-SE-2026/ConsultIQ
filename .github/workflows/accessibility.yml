name: Accessibility NFR

on:
  pull_request:
    branches: [dev, main]

jobs:
  verify-frontend-accessibility:
    name: Frontend Accessibility (NFR)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Run accessibility audit (Lighthouse CI)
        working-directory: frontend
        run: npx --no-install lhci autorun --config=lighthouserc.public.cjs

      - name: Upload accessibility report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11y-report-public
          path: frontend/lhci-reports/public