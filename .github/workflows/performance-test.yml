name: Performance Tests (Manual)

on:
  workflow_dispatch:
    inputs:
      target_mode:
        description: 'emulated_ephemeral = safe, throwaway DB with the staging image. real_staging = hits live staging data.'
        required: true
        type: choice
        default: 'emulated_ephemeral'
        options:
          - emulated_ephemeral
          - real_staging
      test_profile:
        description: 'Which test profile to run'
        required: true
        type: choice
        default: 'match_run_isolated'
        options:
          - match_run_isolated
          - match_run_burst
          - pool_stress
          - full
          - cache_warmcold
          - all
      backend_image_tag:
        description: '(emulated_ephemeral only) Image tag to pull, e.g. "staging" or "latest". Leave blank to use this commit''s SHA - only works if this exact commit was already pushed to main/dev and built by Deploy.yml.'
        required: false
        default: ''
      confirm_staging_writes:
        description: '(real_staging only) Type "yes" to allow write-touching profiles (full, cache_warmcold, all) to run against real staging data.'
        required: false
        default: 'no'

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/cos301-se-2026/consultiq-backend

permissions:
  contents: read
  packages: read

concurrency:
  group: performance-tests-${{ github.event.inputs.target_mode }}
  cancel-in-progress: false

jobs:
  guard-write-confirmation:
    name: Verify write confirmation (real_staging only)
    if: ${{ github.event.inputs.target_mode == 'real_staging' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation for write-touching profiles
        run: |
          PROFILE="${{ github.event.inputs.test_profile }}"
          CONFIRM="${{ github.event.inputs.confirm_staging_writes }}"
          WRITE_PROFILES="full cache_warmcold all"

          if echo "$WRITE_PROFILES" | grep -qw "$PROFILE"; then
            if [ "$CONFIRM" != "yes" ]; then
              echo "::error::Profile '$PROFILE' performs real writes against staging. Re-run with confirm_staging_writes set to 'yes' to proceed."
              exit 1
            fi
            echo "Write confirmation received for profile '$PROFILE'. Proceeding."
          else
            echo "Profile '$PROFILE' is read-only - no write confirmation required."
          fi

  performance-test-emulated:
    name: Run k6 (emulated staging, ephemeral DB)
    if: ${{ github.event.inputs.target_mode == 'emulated_ephemeral' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ secrets.TESTING_DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.TESTING_DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.TESTING_DB_NAME }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies (for seeding)
        working-directory: backend
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        working-directory: backend
        run: npx --no-install prisma generate

      - name: Determine image tag
        id: image_tag
        run: |
          TAG="${{ github.event.inputs.backend_image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.sha }}"
            echo "No backend_image_tag given - defaulting to this commit's SHA ($TAG). This only works if this exact commit was already pushed to main/dev and built by Deploy.yml."
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull backend image
        run: |
          IMAGE="${{ env.BACKEND_IMAGE }}:${{ steps.image_tag.outputs.tag }}"
          echo "Pulling $IMAGE ..."
          if ! docker pull "$IMAGE"; then
            echo "::error::Could not pull $IMAGE. If you left backend_image_tag blank, this commit may never have been pushed to main/dev (no image was built for it). Try backend_image_tag=staging or backend_image_tag=latest instead."
            exit 1
          fi

      - name: Run backend container against ephemeral services
        env:
          TEST_DB_URL: ${{ secrets.TESTING_DB_URL }}
        run: |
          docker run -d --name backend --network host \
            -e DATABASE_URL="$TEST_DB_URL" \
            -e REDIS_URL="redis://localhost:6379" \
            -e PORT=3000 \
            -e AWS_REGION="${{ secrets.AWS_REGION || 'af-south-1' }}" \
            -e AWS_S3_BUCKET="${{ secrets.TEST_AWS_S3_BUCKET || 'consultiq-test-bucket' }}" \
            -e AWS_ACCESS_KEY_ID="${{ secrets.TEST_AWS_ACCESS_KEY_ID || 'test-access-key-id' }}" \
            -e AWS_SECRET_ACCESS_KEY="${{ secrets.TEST_AWS_SECRET_ACCESS_KEY || 'test-secret-access-key' }}" \
            -e ANTHROPIC_API_KEY="${{ secrets.TEST_ANTHROPIC_API_KEY || 'test-anthropic-key' }}" \
            "${{ env.BACKEND_IMAGE }}:${{ steps.image_tag.outputs.tag }}"
          # --network host lets the container reach the postgres/redis
          # service containers via localhost, since GitHub Actions maps
          # their ports onto the runner host itself.

      - name: Push Prisma schema to ephemeral DB
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.TESTING_DB_URL }}
        run: npx --no-install prisma db push --accept-data-loss

      - name: Wait for backend to become healthy
        run: npx --yes wait-on http://localhost:3000/health -t 30000

      - name: Seed ephemeral DB (200 consultants, per NFR4)
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.TESTING_DB_URL }}
        run: npx ts-node prisma/seed-test.ts

      - name: Verify seeded test-users.json exists
        run: |
          if [ ! -f tests/load/test-users.json ]; then
            echo "::error::tests/load/test-users.json was not produced by seed-test.ts. Check the seed script's output path."
            exit 1
          fi

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Run selected profile(s)
        working-directory: tests/load
        env:
          TARGET_URL: 'http://localhost:3000'
          TEST_PROFILE: ${{ github.event.inputs.test_profile }}
        run: |
          set -e
          mkdir -p ../../perf-results

          run_profile() {
            local profile="$1"
            echo "::group::Phase: $profile"
            if [ "$profile" = "cache_warmcold" ]; then
              redis-cli -h localhost -p 6379 FLUSHALL || echo "::warning::redis-cli not available on runner - skipping FLUSHALL, cold read may not be genuinely cold."
              k6 run k6-cache-warmcold.js | tee "../../perf-results/$profile.log"
            else
              TEST_PROFILE="$profile" k6 run k6-test.js | tee "../../perf-results/$profile.log"
            fi
            echo "::endgroup::"
          }

          if [ "$TEST_PROFILE" = "all" ]; then
            for profile in match_run_isolated match_run_burst pool_stress full cache_warmcold; do
              run_profile "$profile"
            done
          else
            run_profile "$TEST_PROFILE"
          fi

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-performance-results-emulated-${{ github.run_id }}
          path: perf-results/
          retention-days: 30

      - name: Stop backend container
        if: always()
        run: docker stop backend && docker rm backend || true

  performance-test-real-staging:
    name: Run k6 (real staging)
    if: ${{ github.event.inputs.target_mode == 'real_staging' }}
    runs-on: ubuntu-latest
    needs: guard-write-confirmation
    environment: staging-performance
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Write staging test-user credentials
        working-directory: tests/load
        env:
          STAGING_TEST_USERS_JSON: ${{ secrets.STAGING_TEST_USERS_JSON }}
        run: |
          if [ -z "$STAGING_TEST_USERS_JSON" ]; then
            echo "::error::Secret STAGING_TEST_USERS_JSON is not set. Add a repo or environment secret containing the JSON array of staging test users (email/password/role) k6-test.js expects."
            exit 1
          fi
          echo "$STAGING_TEST_USERS_JSON" > test-users.json

      - name: Run selected profile(s)
        working-directory: tests/load
        env:
          TARGET_URL: ${{ secrets.STAGING_TARGET_URL }}
          TEST_PROFILE: ${{ github.event.inputs.test_profile }}
        run: |
          set -e
          mkdir -p ../../perf-results

          run_profile() {
            local profile="$1"
            echo "::group::Phase: $profile"
            if [ "$profile" = "cache_warmcold" ]; then
              echo "NOTE: Redis is NOT flushed before this run against real staging - 'cold' readings here are not a true cold-cache measurement."
              k6 run k6-cache-warmcold.js | tee "../../perf-results/$profile.log"
            else
              TEST_PROFILE="$profile" k6 run k6-test.js | tee "../../perf-results/$profile.log"
            fi
            echo "::endgroup::"
          }

          if [ "$TEST_PROFILE" = "all" ]; then
            for profile in match_run_isolated match_run_burst pool_stress full cache_warmcold; do
              run_profile "$profile"
            done
          else
            run_profile "$TEST_PROFILE"
          fi

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-performance-results-staging-${{ github.run_id }}
          path: perf-results/
          retention-days: 30