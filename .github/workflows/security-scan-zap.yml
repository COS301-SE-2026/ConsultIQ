name: OWASP ZAP Security Scan

on :
  push:
    branches:
      - main
      - dev
      - mobilise-admin-pages
  workflow_dispatch:
    inputs:
      target_url: 
        description: 'Target URL to scan (default: staging backend)'
        required: false
        default: 'https://consultiq-backend-production-086b.up.railway.app'

jobs: 
  owasp-zap-scan:
    name: OWASP ZAP Baseline Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set Target URL
        id: set_url
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "target_url=${{ github.event.inputs.target_url }}" >> $GITHUB_OUTPUT
          else
            echo "target_url=${{ secrets.STAGING_URL || 'https://consultiq-backend-production-086b.up.railway.app' }}" >> $GITHUB_OUTPUT
          fi

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ steps.set_url.outputs.target_url }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: >
            -a
            -d
            -T 10
            -c .zap/zap-config.conf
          allow_issue_writing: false
          artifact_name: zapBaselineScan
      
      - name: Run OWASP ZAP Full Scan
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c # v0.13.0
        with:
          target: ${{ steps.set_url.outputs.target_url }}
          rules_file_name: '.zap/rules.tsv'
          artifact_name: zapFullScan
          cmd_options: >
            -a
            -d
            -T 10
            -c .zap/zap-config.conf
          allow_issue_writing: false
