name: OWASP ZAP Security Scan

on :
  push:
    branches:
      - main
      - dev
      - feature/backend/security-testing
  workflow_dispatch:
    inputs:
      target_url: 
        description: 'Target URL to scan (default: staging backend)'
        required: false
        default: 'http://localhost:3001'

jobs: 
  owasp-zap-scan:
    name: OWASP ZAP Baseline Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Target URL
        id: set_url
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "target_url=${{ github.event.inputs.target_url }}" >> $GITHUB_OUTPUT
          else
            echo "target_url=${{ secrets.STAGING_URL || 'https://consultiq-backend-production-086b.up.railway.app' }}" >> $GITHUB_OUTPUT
          fi

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ steps.set_url.outputs.target_url }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: >
            -a
            -d
            -T 10
            -c .zap/zap-config.conf
          allow_issue_writing: false
      
      - name: Run OWASP ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: ${{ steps.set_url.outputs.target_url }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: >
            -a
            -d
            -T 10
            -c .zap/zap-config.conf
          allow_issue_writing: false
