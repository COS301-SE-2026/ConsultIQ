<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 104" width="100%" height="100%">
  <!-- T -->
  <path d="M 0 0 H 38 V 11 H 24.5 V 58 H 13.5 V 11 H 0 Z" fill="#162D42" transform="translate(10, 23)" />
  
  <!-- R -->
  <path d="M 0 0 H 22 C 34 0 40 6 40 16 C 40 24 35 29 27 31 L 41 58 H 27 L 15 33 H 12 V 58 H 0 Z M 12 11 V 23 H 21 C 26 23 28 20 28 17 C 28 14 26 12 21 11 Z" fill="#162D42" transform="translate(52, 23)" />

  <!-- Central Icon (The first 'O') -->
  <g transform="translate(94, 23)">
    
    <!-- Mask to create true transparency for the arrow cutout and the halo around the teal path -->
    <mask id="gear-mask">
      <!-- Base mask (keeps everything) -->
      <rect x="-10" y="-10" width="90" height="90" fill="white" />
      
      <!-- Inner upward arrow cutout (black = transparent hole) -->
      <path d="M 30 13 L 18 26 H 25 V 42 H 35 V 26 H 42 Z" fill="black" />
      
      <!-- Thick black outlines to cut gaps around the teal shapes -->
      <path d="M 16 40 L 26 56 L 52 10" fill="none" stroke="black" stroke-width="9" stroke-linejoin="round" />
      <rect x="8" y="36" width="16" height="8" rx="4" transform="rotate(-60 16 40)" fill="none" stroke="black" stroke-width="8" />
      <rect x="30" y="30" width="16" height="8" rx="4" transform="rotate(-60 38 34)" fill="none" stroke="black" stroke-width="8" />
      <path d="M 57 2 L 44 7 L 53 17 Z" fill="black" stroke="black" stroke-width="6" stroke-linejoin="round" />
    </mask>

    <!-- Navy Gear Base -->
    <g mask="url(#gear-mask)" fill="#162D42">
      <!-- Main solid circle -->
      <circle cx="30" cy="30" r="21" />
      <!-- Five Gear Teeth (Left side distribution) -->
      <g>
        <rect x="25" y="5" width="10" height="8" rx="1.5" />
        <rect x="25" y="5" width="10" height="8" rx="1.5" transform="rotate(-45 30 30)" />
        <rect x="25" y="5" width="10" height="8" rx="1.5" transform="rotate(-90 30 30)" />
        <rect x="25" y="5" width="10" height="8" rx="1.5" transform="rotate(-135 30 30)" />
        <rect x="25" y="5" width="10" height="8" rx="1.5" transform="rotate(180 30 30)" />
      </g>
    </g>

    <!-- Teal Chain Links and Swooshing Arrow -->
    <g fill="none" stroke="#228A9E" stroke-linejoin="round">
      <!-- Continuous swoosh line -->
      <path d="M 16 40 L 26 56 L 52 10" stroke-width="4.5" />
      <!-- Bottom-left Chain Link -->
      <rect x="8" y="36" width="16" height="8" rx="4" transform="rotate(-60 16 40)" stroke-width="3.5" />
      <!-- Center-right Chain Link -->
      <rect x="30" y="30" width="16" height="8" rx="4" transform="rotate(-60 38 34)" stroke-width="3.5" />
      <!-- Top-right Arrowhead -->
      <path d="M 57 2 L 44 7 L 53 17 Z" fill="#228A9E" stroke-width="2" />
    </g>
    
  </g>

  <!-- Second O -->
  <path d="M 21 0 C 35 0 42 11 42 29 C 42 47 35 58 21 58 C 7 58 0 47 0 29 C 0 11 7 0 21 0 Z M 21 11 C 14 11 12 18 12 29 C 12 40 14 47 21 47 C 28 47 30 40 30 29 C 30 18 28 11 21 11 Z" fill="#162D42" transform="translate(160, 23)" />
  
  <!-- S -->
  <path d="M 2 45 L 10 37 C 14 42 19 45 25 45 C 31 45 33 43 33 40 C 33 36 29 34 19 31 C 9 28 0 24 0 14 C 0 4 9 0 23 0 C 32 0 39 3 43 8 L 36 16 C 31 12 27 10 22 10 C 16 10 13 12 13 16 C 13 20 17 21 27 24 C 37 27 45 32 45 41 C 45 52 36 58 24 58 C 14 58 7 54 2 45 Z" fill="#162D42" transform="translate(208, 23)" />
</svg>