<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <style>
      .bg-main { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
      .bg-card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
      .text-title { font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; font-size: 13px; font-weight: 700; fill: #64748b; letter-spacing: 1px; }
      .text-factor { font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; font-size: 14px; font-weight: 600; fill: #0f172a; }
      .text-percent { font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; font-size: 14px; font-weight: 700; fill: #2563eb; }
      .text-desc { font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; font-size: 13px; font-weight: 400; fill: #64748b; }
      .bar-bg { fill: #e2e8f0; }
      .bar-fill { fill: #2563eb; }
    </style>
  </defs>

  <!-- Main Container -->
  <rect x="10" y="10" width="980" height="500" rx="12" class="bg-main" />
  <text x="40" y="50" class="text-title">ACTIVE FACTOR DISTRIBUTION AND WEIGHTS</text>

  <!-- Skill Alignment Card -->
  <g transform="translate(40, 80)">
    <rect width="450" height="110" rx="8" class="bg-card" />
    <text x="20" y="30" class="text-factor">Skill Alignment (40% Weight)</text>
    <text x="430" y="30" text-anchor="end" class="text-percent">50%</text>
    <rect x="20" y="45" width="410" height="8" rx="4" class="bar-bg" />
    <rect x="20" y="45" width="0" height="8" rx="4" class="bar-fill">
      <animate attributeName="width" values="0;205;205;0" keyTimes="0;0.15;0.9;1" dur="8s" repeatCount="indefinite" />
    </rect>
    <text x="20" y="75" class="text-desc">Mandatory skill(s): 1/2 Matched (Missing: Javascript)</text>
  </g>

  <!-- Competency Level Card -->
  <g transform="translate(510, 80)">
    <rect width="450" height="110" rx="8" class="bg-card" />
    <text x="20" y="30" class="text-factor">Competency Level (30% Weight)</text>
    <text x="430" y="30" text-anchor="end" class="text-percent">73%</text>
    <rect x="20" y="45" width="410" height="8" rx="4" class="bar-bg" />
    <rect x="20" y="45" width="0" height="8" rx="4" class="bar-fill">
      <animate attributeName="width" values="0;299;299;0" keyTimes="0;0.15;0.9;1" dur="8s" repeatCount="indefinite" />
    </rect>
    <text x="20" y="75" class="text-desc">
      <tspan x="20" dy="0">Competency Match: 66.7%. Bonus applied for 3 extra skill(s): +6.0%.</tspan>
      <tspan x="20" dy="20">Missing mandatory skill(s): javascript.</tspan>
    </text>
  </g>

  <!-- Cost To Company Card -->
  <g transform="translate(40, 210)">
    <rect width="450" height="110" rx="8" class="bg-card" />
    <text x="20" y="30" class="text-factor">Cost To Company (5% Weight)</text>
    <text x="430" y="30" text-anchor="end" class="text-percent">100%</text>
    <rect x="20" y="45" width="410" height="8" rx="4" class="bar-bg" />
    <rect x="20" y="45" width="0" height="8" rx="4" class="bar-fill">
      <animate attributeName="width" values="0;410;410;0" keyTimes="0;0.15;0.9;1" dur="8s" repeatCount="indefinite" />
    </rect>
    <text x="20" y="75" class="text-desc">
      <tspan x="20" dy="0">Within budget. Available: R 6243.00/day | Consultant Cost:</tspan>
      <tspan x="20" dy="20">R 1731.50/day based on 50% capacity.</tspan>
    </text>
  </g>

  <!-- Location Card -->
  <g transform="translate(510, 210)">
    <rect width="450" height="110" rx="8" class="bg-card" />
    <text x="20" y="30" class="text-factor">Location (10% Weight)</text>
    <text x="430" y="30" text-anchor="end" class="text-percent">58%</text>
    <rect x="20" y="45" width="410" height="8" rx="4" class="bar-bg" />
    <rect x="20" y="45" width="0" height="8" rx="4" class="bar-fill">
      <animate attributeName="width" values="0;238;238;0" keyTimes="0;0.15;0.9;1" dur="8s" repeatCount="indefinite" />
    </rect>
    <text x="20" y="75" class="text-desc">Travel time: 24 mins (16.3 km).</text>
  </g>

  <!-- Availability Card -->
  <g transform="translate(40, 340)">
    <rect width="450" height="110" rx="8" class="bg-card" />
    <text x="20" y="30" class="text-factor">Availability (15% Weight)</text>
    <text x="430" y="30" text-anchor="end" class="text-percent">100%</text>
    <rect x="20" y="45" width="410" height="8" rx="4" class="bar-bg" />
    <rect x="20" y="45" width="0" height="8" rx="4" class="bar-fill">
      <animate attributeName="width" values="0;410;410;0" keyTimes="0;0.15;0.9;1" dur="8s" repeatCount="indefinite" />
    </rect>
    <text x="20" y="75" class="text-desc">Requires 50% capacity | Has 100% remaining</text>
  </g>
</svg>