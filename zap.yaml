env:
  contexts:
  - excludePaths: []
    name: baseline
    urls:
    - http://127.0.0.1:3000
  parameters:
    failOnError: true
    progressToStdout: false
jobs:
- parameters:
    enableTags: false
    maxAlertsPerRule: 10
  type: passiveScan-config
- parameters:
    maxDuration: 1
    url: http://127.0.0.1:3000
  type: spider
- parameters:
    maxDuration: 0
  type: passiveScan-wait
- parameters:
    format: Long
    summaryFile: /home/zap/zap_out.json
  rules:
  - action: FAIL
    customMessage: ''
    id: 10019
  - action: FAIL
    customMessage: ''
    id: 10020
  - action: FAIL
    customMessage: ''
    id: 10021
  - action: FAIL
    customMessage: ''
    id: 10031
  - action: FAIL
    customMessage: ''
    id: 10035
  - action: FAIL
    customMessage: ''
    id: 10038
  - action: FAIL
    customMessage: ''
    id: 10043
  - action: WARN
    customMessage: ''
    id: 10202
  - action: WARN
    customMessage: ''
    id: 10049
  - action: WARN
    customMessage: ''
    id: 10063
  - action: IGNORE
    customMessage: ''
    id: 90003
  type: outputSummary
- parameters:
    reportDescription: ''
    reportDir: /zap/wrk/
    reportFile: zap-report.html
    reportTitle: ZAP Scanning Report
    template: traditional-html
  type: report
